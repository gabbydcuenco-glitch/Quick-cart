# Single public entry point of QuickCart.
# Docker's DNS (127.0.0.11) is asked again every 10 seconds, so the proxy keeps working
# even when an API container is recreated with a new IP address during a deployment.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    add_header Cache-Control "no-store" always;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;

    # Health check of the proxy itself (used by the Docker HEALTHCHECK)
    location = /nginx-health {
        access_log off;
        return 200 "ok";
    }

    location /api/catalog {
        set $catalog http://catalog-api:3001;
        proxy_pass $catalog;
    }

    location /api/orders {
        set $orders http://order-api:3002;
        proxy_pass $orders;
    }

    location /api/support {
        set $support http://order-api:3002;
        proxy_pass $support;
    }

    # Route the simulated payment API through the same entry point as the other APIs.
    # Checkout still calls order-api, which calculates the amount and saves the order.
    location /api/payment {
        set $payment http://payment-api:3003;
        proxy_pass $payment;
    }

    # Everything else is the React frontend
    location / {
        set $frontend http://frontend:8080;
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
