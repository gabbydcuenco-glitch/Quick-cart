# Jenkins is deployed separately from the application, so the pipeline never redeploys Jenkins itself.
services:
  jenkins:
    build: .
    container_name: jenkins
    user: root                  # classroom/lab only: lets Jenkins use the Docker socket
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"             # Jenkins web UI at http://localhost:8081
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      QUICKCART_LOCAL_DEMO: "true"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
